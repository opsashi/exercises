<!-- WRITE A HTML PROGRAM TO SHOW DIFFERENT CHARACTER FORMATTING (B,I,U,SUB,SUP) TAGS.
                    VIZ:H20 AND E=MC^2.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARACTER FORMATING TAGS</title>
</head>
<body>
    <H1>CHARACTER FORMATING TAGS</H1>
    <P><B>THIS IS BOLD</B></P>
    <P><I>THIS IS ITALIC</I></P>
    <P><U>THIS IS UNDERLINE</U></P>

    <P>WATER FORMULA USING SUB:- H<SUB>2</SUB>O</P>
    <P>EINSTEIN'S EQUATION USING SUP:- E=MC<SUP>2</SUP></P>
</body>
</html>
